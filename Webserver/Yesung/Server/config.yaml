server:
  host: 0.0.0.0
  port: 8080

ros:
  node_name: guiderobot_web_server
  action_name: /navigate_to_pose
  manual_mode_topic: /manual_mode
  frame_id: map
  use_sim_time: false

# 아래 좌표는 예시값입니다. 실제 지도에서 측정한 x, y, yaw 값으로 바꾸세요.
# yaw 단위는 degree가 아니라 radian입니다.
destinations:
  restroom:
    name: 화장실 앞
    x: 1.0
    y: 0.0
    yaw: 0.0
  room_301:
    name: 강의실 301호
    x: 2.0
    y: 0.0
    yaw: 0.0
  room_302:
    name: 강의실 302호
    x: 3.0
    y: 0.0
    yaw: 0.0
  elevator:
    name: 엘리베이터 앞
    x: 4.0
    y: 0.0
    yaw: 0.0
