spring.application.name=demo

# ROS 2 settings. These can be overridden with environment variables.
manager.ros2.executable=${ROS2_EXECUTABLE:/opt/ros/jazzy/bin/ros2}
manager.ros2.setup-file=${ROS2_SETUP_FILE:/opt/ros/jazzy/setup.bash}
manager.ros2.goal-topic=${ROS2_GOAL_TOPIC:/goal_pose}
manager.ros2.cmd-vel-topic=${CMD_VEL_TOPIC:/cmd_vel}
manager.ros2.status-bridge-enabled=${ROS2_STATUS_BRIDGE_ENABLED:true}
manager.ros2.python-executable=${PYTHON_EXECUTABLE:python3}
manager.ros2.action-status-topic=${NAV_ACTION_STATUS_TOPIC:/navigate_to_pose/_action/status}
manager.ros2.server-url=${WEB_SERVER_URL:http://127.0.0.1:8080}
manager.ros2.publish-timeout=${ROS2_PUBLISH_TIMEOUT:10s}
