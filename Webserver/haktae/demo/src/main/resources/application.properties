spring.application.name=demo

# ROS 2 settings. These can be overridden with environment variables.
manager.ros2.executable=${ROS2_EXECUTABLE:/opt/ros/jazzy/bin/ros2}
manager.ros2.setup-file=${ROS2_SETUP_FILE:/opt/ros/jazzy/setup.bash}
manager.ros2.goal-topic=${ROS2_GOAL_TOPIC:/goal_pose}
manager.ros2.publish-timeout=${ROS2_PUBLISH_TIMEOUT:10s}
