<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로봇 목적지 선택</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
    <header>
        <div>
            <p class="eyebrow">ROBOT NAVIGATION</p>
            <h1>어디로 이동할까요?</h1>
            <p class="subtitle">목적지를 누르면 로봇에 좌표를 전송합니다.</p>
        </div>
        <div id="serverStatus" class="badge pending"><span></span>서버 확인 중</div>
    </header>

    <section id="destinations" class="grid" aria-label="목적지 목록">
        <button class="destination" data-destination="toilet">
            <span class="icon" aria-hidden="true">🚻</span>
            <strong>화장실</strong>
            <small>A 구역</small>
        </button>
        <button class="destination" data-destination="301">
            <span class="icon" aria-hidden="true">301</span>
            <strong>301호</strong>
            <small>B 구역</small>
        </button>
        <button class="destination" data-destination="302">
            <span class="icon" aria-hidden="true">302</span>
            <strong>302호</strong>
            <small>C 구역</small>
        </button>
        <button class="destination" data-destination="elevator">
            <span class="icon" aria-hidden="true">↕</span>
            <strong>엘리베이터</strong>
            <small>D 구역</small>
        </button>
    </section>

    <div id="message" class="message" role="status" aria-live="polite">
        목적지를 선택해 주세요.
    </div>
</main>

<section id="manualOverlay" class="manual-overlay" aria-live="assertive" hidden>
    <div class="manual-panel">
        <div class="manual-icon" aria-hidden="true">✥</div>
        <p class="eyebrow">MANUAL CONTROL</p>
        <h2>관리자가 수동 조작 중입니다</h2>
        <p>안전을 위해 잠시만 기다려 주세요.<br>수동 조작이 끝나면 목적지 화면으로 자동 전환됩니다.</p>
        <div class="manual-waiting"><span></span>수동 운행 종료 대기 중</div>
    </div>
</section>
<script src="/app.js"></script>
</body>
</html>
